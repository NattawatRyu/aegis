name: ci

on:
  # Branches only: a release tag runs this through release.yml instead.
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  AEGIS_REQUIRE_DOTNET: 1

# Ubuntu is pinned, not ubuntu-latest: the label moves to 26.04 on its own,
# and a green run should only change when the code does.
jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all -- --check

  test:
    # Linux: every 127.0.0.0/8 address is bindable, which the harness needs
    # (one loopback IP per bot). Windows: where Aegis is developed, and whose
    # UDP stack has already surfaced real bugs. macOS only binds 127.0.0.1,
    # so the harness cannot run there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      # For aegis-ffi's test of the C# binding (bindings/csharp), which
      # AEGIS_REQUIRE_DOTNET turns from skipped-without-dotnet into required.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      # aegis-serve turns Noise on in aegis-protocol and aegis-relay, and a
      # workspace build unifies features: built with it, they always have
      # Noise. Built on their own (`-p`, without aegis-serve) they do not, so
      # Noise-off is linted and tested that way.
      - name: clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo clippy -p aegis-netguard-protocol -p aegis-netguard-relay -p aegis-netguard-ffi --all-targets -- -D warnings
      - name: docs, as docs.rs builds them
        # A broken intra-doc link shipped in 0.1.0-alpha.1; docs.rs renders
        # it as plain text without failing, so only this step catches it.
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps --exclude aegis-harness
          cargo doc --workspace --no-deps --exclude aegis-harness --all-features
      - name: test
        # Includes the network oracles: the UDP and relay runs must write
        # telemetry byte-identical to the in-process run. And aegis-ffi's C
        # examples, built with this runner's C compiler against aegis.h.
        run: cargo test --workspace
      - name: test, Noise off and opt-in Noise
        run: |
          cargo test -p aegis-netguard-protocol -p aegis-netguard-relay -p aegis-netguard-ffi
          cargo test -p aegis-netguard-protocol --features noise
          cargo test -p aegis-netguard-relay --features noise
          cargo test -p aegis-netguard-ffi --features noise
      - name: harness, three transports
        run: |
          cargo run -q -p aegis-harness
          cargo run -q -p aegis-harness -- --udp
          cargo run -q -p aegis-harness -- --relay
      - name: telemetry identical across transports
        run: |
          cmp scenarios/out/standard.jsonl scenarios/out/standard.udp.jsonl
          cmp scenarios/out/standard.jsonl scenarios/out/standard.relay.jsonl

  godot:
    # demos/godot run headless in a real engine: the aimbot, humanized and
    # triggerbot flagged and no honest or pro player (crates/ffi/tests/godot.rs).
    # The editor is pinned and checked against Godot's published SHA512.
    runs-on: ubuntu-24.04
    env:
      GODOT_ZIP: Godot_v4.7.2-stable_mono_linux_x86_64.zip
      GODOT_SHA512: 1855960b27ee3ef5e66e5e228cced69d55637b24334a7411162687dcd077d8f9f645348cdb8eae984bec8135d49ed855a1e3a16476786b8bce60774fd8402d13
      AEGIS_REQUIRE_GODOT: 1
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Godot 4.7.2 .NET
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$GODOT_ZIP" \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/$GODOT_ZIP"
          echo "$GODOT_SHA512  $RUNNER_TEMP/$GODOT_ZIP" | sha512sum -c -
          unzip -q "$RUNNER_TEMP/$GODOT_ZIP" -d "$RUNNER_TEMP/godot"
          exe=$(find "$RUNNER_TEMP/godot" -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' | head -n1)
          test -n "$exe" && chmod +x "$exe"
          echo "AEGIS_GODOT=$exe" >> "$GITHUB_ENV"
      - name: the Godot demo
        run: cargo test -p aegis-netguard-ffi --test godot -- --nocapture
