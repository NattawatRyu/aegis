[workspace]
resolver = "2"
members = ["crates/protocol", "crates/server", "crates/telemetry", "crates/client-sdk", "crates/harness"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/NattawatRyu/aegis"
authors = ["Nattawat <nuttarwit@gmail.com>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
