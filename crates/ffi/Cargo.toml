[package]
name = "aegis-netguard-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Aegis C ABI: the online detector (pillar C) for engines that are not written in Rust. Header: include/aegis.h."

[lib]
# The library file stays aegis_ffi.dll / libaegis_ffi.so.
name = "aegis_ffi"
crate-type = ["rlib", "cdylib"]

[dependencies]
aegis-detector.workspace = true
aegis-telemetry.workspace = true
aegis-protocol.workspace = true
aegis-client-sdk.workspace = true
aegis-server.workspace = true

[features]
# aegis_noise_*: keys from a relay that is its own backend (Noise NK).
noise = ["aegis-protocol/noise", "aegis-relay/noise"]

[dev-dependencies]
# Finds the platform's C compiler (MSVC, gcc, clang) for the test that
# builds and runs the C example against the real library.
cc = "1"
aegis-relay.workspace = true
