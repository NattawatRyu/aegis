[package]
name = "aegis-protocol"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Aegis wire protocol — the intent-only contract every crate depends on."

[dependencies]
serde.workspace = true
bincode.workspace = true
siphasher = "1"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.3"
snow = { version = "0.10", optional = true }

[features]
# Opt-in: a relay that is its own backend, keys delivered over a Noise NK
# handshake instead of by the game's backend over HTTPS (`noise`).
noise = ["dep:snow"]
