[package]
name = "aegis-relay"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Aegis relay: the only address clients ever see. Forwards to an origin whose address stays private."

[dependencies]
aegis-protocol = { path = "../protocol" }

[features]
# Opt-in: answer Noise NK hellos and hand out sessions without a backend.
noise = ["aegis-protocol/noise"]
