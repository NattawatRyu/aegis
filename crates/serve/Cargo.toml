[package]
name = "aegis-serve"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Aegis as a running game server: the authoritative server at 30 Hz behind a relay that hands out sessions over Noise, with the detector watching live."

[dependencies]
aegis-protocol = { path = "../protocol", features = ["noise"] }
aegis-server = { path = "../server" }
aegis-telemetry = { path = "../telemetry" }
aegis-detector = { path = "../detector" }
aegis-client-sdk = { path = "../client-sdk" }
aegis-relay = { path = "../relay", features = ["noise"] }
serde_json.workspace = true
